name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NXF_VER: "25.10.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}
      - name: nextflow lint
        run: nextflow lint .
      - name: Validate nextflow_schema.json is well-formed JSON
        run: python3 -m json.tool nextflow_schema.json > /dev/null

  stub-test:
    name: stub run (${{ matrix.case }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        case: [default, alt_tools, vqsr_vep, wgs_minimal]
        nxf_ver: ["25.10.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_ver }}
      - name: Run pipeline in stub mode
        run: |
          extra=""
          if [ "${{ matrix.case }}" != "default" ]; then
            extra="-params-file tests/params/${{ matrix.case }}.yml"
          fi
          nextflow run . -profile test -stub-run --outdir results $extra
      - name: Check expected outputs
        run: |
          test -s results/pipeline_info/software_versions.yml
          test -f results/multiqc/multiqc_report.html
          ls -R results | head -100
